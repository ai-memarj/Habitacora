<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar__title">
      <h1>Bitácora</h1>
      <div class="topbar__meta">
        <p id="today-label" class="muted"></p>
        <span id="streak-badge" class="streak-badge hidden"></span>
      </div>
    </div>
    <div class="topbar__nav">
      <button id="prev-day" class="icon-btn" title="Día anterior" aria-label="Día anterior">‹</button>
      <input type="date" id="date-picker">
      <button id="next-day" class="icon-btn" title="Día siguiente" aria-label="Día siguiente">›</button>
    </div>
  </header>

  <main class="grid">

    <!-- Frase del día -->
    <section class="card card--quote">
      <label for="quote-input">Frase del día</label>
      <textarea id="quote-input" rows="2" placeholder="Escribe algo que quieras recordar hoy..."></textarea>
    </section>

    <!-- Estado de ánimo -->
    <section class="card card--mood">
      <label>¿Cómo te sientes hoy?</label>
      <div class="mood-selector" id="mood-selector">
        <button class="mood-option" data-mood="1" title="Muy mal" type="button">😞</button>
        <button class="mood-option" data-mood="2" title="Mal" type="button">🙁</button>
        <button class="mood-option" data-mood="3" title="Normal" type="button">😐</button>
        <button class="mood-option" data-mood="4" title="Bien" type="button">🙂</button>
        <button class="mood-option" data-mood="5" title="Muy bien" type="button">😄</button>
      </div>
    </section>

    <!-- Tareas del día -->
    <section class="card card--tasks">
      <div class="card-header">
        <h2>Tareas de hoy</h2>
        <span id="total-minutes" class="pill">0 min</span>
      </div>

      <form id="task-form" class="task-form">
        <select id="task-category" required></select>
        <input type="text" id="task-name" placeholder="Nombre de la tarea" required autocomplete="off">
        <div class="minutes-field">
          <input type="number" id="task-minutes" placeholder="min" min="1" required>
          <div class="chip-row" id="minute-chips">
            <button type="button" class="chip" data-minutes="15">15</button>
            <button type="button" class="chip" data-minutes="30">30</button>
            <button type="button" class="chip" data-minutes="45">45</button>
            <button type="button" class="chip" data-minutes="60">60</button>
          </div>
        </div>
        <button type="submit" class="btn-primary">
          <span class="btn-plus">+</span> Añadir
        </button>
      </form>

      <ul id="task-list" class="task-list"></ul>

      <div id="category-breakdown" class="category-breakdown hidden"></div>

      <button id="manage-categories-btn" class="link-btn">Gestionar categorías</button>
    </section>

    <!-- Sueño -->
    <section class="card card--sleep">
      <div class="card-header">
        <h2>Sueño</h2>
        <span id="sleep-duration" class="pill pill--soft hidden"></span>
      </div>
      <div class="sleep-grid">
        <label>Hora de dormir
          <input type="time" id="sleep-time">
        </label>
        <label>Hora de despertar
          <input type="time" id="wake-time">
        </label>
      </div>
      <div class="sleep-grid sleep-grid--phases">
        <label>Ligero %
          <input type="number" id="light-pct" min="0" max="100">
        </label>
        <label>Profundo %
          <input type="number" id="deep-pct" min="0" max="100">
        </label>
        <label>REM %
          <input type="number" id="rem-pct" min="0" max="100">
        </label>
      </div>
      <div id="sleep-bar" class="sleep-bar hidden">
        <div class="sleep-bar__segment sleep-bar__segment--light" id="sleep-bar-light"></div>
        <div class="sleep-bar__segment sleep-bar__segment--deep" id="sleep-bar-deep"></div>
        <div class="sleep-bar__segment sleep-bar__segment--rem" id="sleep-bar-rem"></div>
      </div>
      <button id="save-sleep-btn" class="btn-secondary">Guardar sueño</button>
    </section>

    <!-- Notas -->
    <section class="card card--notes">
      <label for="notes-input">Notas del día</label>
      <textarea id="notes-input" rows="4" placeholder="Cualquier cosa que quieras anotar hoy..."></textarea>
    </section>

  </main>
</div>

<!-- Modal gestión de categorías -->
<div id="category-modal" class="modal hidden">
  <div class="modal__content">
    <div class="modal__header">
      <h2>Categorías</h2>
      <button id="close-category-modal" class="icon-btn" aria-label="Cerrar">✕</button>
    </div>
    <ul id="category-list" class="category-list"></ul>
    <form id="category-form" class="category-form">
      <input type="text" id="category-name" placeholder="Nueva categoría" required autocomplete="off">
      <input type="color" id="category-color" value="#6C5CE7">
      <button type="submit" class="btn-primary">Crear</button>
    </form>
  </div>
</div>

<!-- Modal de confirmación genérico -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal__content modal__content--small">
    <p id="confirm-message">¿Seguro?</p>
    <div class="modal__actions">
      <button id="confirm-cancel" class="btn-ghost">Cancelar</button>
      <button id="confirm-accept" class="btn-danger">Borrar</button>
    </div>
  </div>
</div>

<!-- Toasts -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
